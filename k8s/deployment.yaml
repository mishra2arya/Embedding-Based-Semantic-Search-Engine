apiVersion: apps/v1
kind: Deployment
metadata:
  name: semantic-search-engine
  namespace: search-system
  labels:
    app.kubernetes.io/name: semantic-search-engine
    app.kubernetes.io/component: api-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: semantic-search-engine
  template:
    metadata:
      labels:
        app: semantic-search-engine
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: api
          image: semantic-search-engine:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: search-engine-config
            - secretRef:
                name: search-engine-secrets
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: index-storage
              mountPath: /app/data
      volumes:
        - name: index-storage
          persistentVolumeClaim:
            claimName: search-index-pvc
