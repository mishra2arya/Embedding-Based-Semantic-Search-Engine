apiVersion: v1
kind: ConfigMap
metadata:
  name: search-engine-config
  namespace: search-system
data:
  APP_ENV: "production"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  EMBEDDING_DIMENSION: "512"
  EMBEDDING_BATCH_SIZE: "64"
  EMBEDDING_DEVICE: "cpu"
  FAISS_INDEX_TYPE: "HNSW"
  FAISS_METRIC: "cosine"
  FAISS_M: "32"
  FAISS_EF_CONSTRUCTION: "200"
  FAISS_EF_SEARCH: "64"
  RETRIEVAL_SEMANTIC_WEIGHT: "0.7"
  RETRIEVAL_LEXICAL_WEIGHT: "0.3"
  RATE_LIMIT_PER_MINUTE: "120"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  PROMETHEUS_METRICS_ENABLED: "true"
